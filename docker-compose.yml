services:
  mysql:
    image: mysql:5.7
    container_name: emtms_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend

    container_name: emtms_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mysql_data: