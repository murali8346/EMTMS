<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Register - EMTMS</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="css/register.css" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="back-link">← Back to Home</a>

            <div class="auth-header">
                <div class="logo">
                    <!-- Professional logo image -->
                    <img src="logo.jpg" alt="EMTMS Logo" class="logo-img" id="logoImg" />
                    <!-- Fallback in case logo.jpg doesn't load -->
                    <span class="logo-icon-fallback" id="logoFallback" style="display:none;">EM</span>
                    EMTMS
                </div>
                <h1>Create Account</h1>
                <p>Join EMTMS and start reporting issues</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required autocomplete="name" />
                </div>

                <div class="form-group">
                    <label for="email">College Email</label>
                    <input type="email" id="email" placeholder="your@drmgrdu.ac.in" required autocomplete="email" />
                    <div class="field-hint">
                        <span class="hint-icon">📧</span>
                        Must be from @drmgrdu.ac.in domain
                    </div>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="">Select your department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="Electrical">Electrical</option>
                        <option value="AI & DS">AI & DS</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mobileNumber">Mobile Number</label>
                    <input type="tel" id="mobileNumber" placeholder="9876543210" required autocomplete="tel" />
                    <div class="field-hint">
                        <span class="hint-icon">📱</span>
                        10-digit mobile number
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimum 4 characters" required autocomplete="new-password" />
                    <div class="field-hint">
                        <span class="hint-icon">🔒</span>
                        Minimum 4 characters
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="submit" class="btn btn-primary" id="registerBtn">
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login.html">Log in here</a>
            </div>
        </div>
    </div>

    <!-- ===== Professional Popup Modal ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Close modal">✕</button>
            <div class="modal-icon success" id="modalIcon">✅</div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Your action was completed successfully.</p>
            <button class="btn btn-primary" id="modalActionBtn">Got it</button>
        </div>
    </div>

        <script src="js/register.js"></script>

</body>
</html>
