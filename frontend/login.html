<!DOCTYPE html>
<html lang="en"> 
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - EMTMS</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        /* ===== Shared Styles ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --primary-glass: rgba(37, 99, 235, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-light: #94a3b8;
            --bg-white: #ffffff;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        /* Background decoration */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 48px 40px;
            box-shadow: var(--shadow-2xl);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: var(--transition);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            margin-bottom: 8px;
        }

        .auth-header .logo-img {
            height: 40px;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
            background: white;
            padding: 2px;
        }

        .auth-header .logo-icon-fallback {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: -0.025em;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-family);
            transition: var(--transition);
            background: var(--bg-white);
           
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background: white;
        }

        .form-group input.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-light);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            font-family: var(--font-family);
            cursor: pointer;
            transition: var(--transition);
            min-height: 52px;
            touch-action: manipulation;
            user-select: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
        }
        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }
        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 8px;
            text-align: center;
            min-height: 24px;
            font-weight: 500;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 16px;
            transition: var(--transition);
            font-weight: 500;
            padding: 4px 0;
        }
        .back-link:hover {
            color: var(--primary);
        }

        /* ===== Professional Popup / Modal ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 420px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: var(--shadow-2xl);
            transform: scale(0.95) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }

        .modal-icon.success {
            background: #dcfce7;
            color: #16a34a;
        }

        .modal-icon.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .modal-icon.info {
            background: #dbeafe;
            color: #2563eb;
        }

        .modal h3 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .modal p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .modal .btn {
            width: 100%;
            justify-content: center;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 4px 8px;
            transition: var(--transition);
            touch-action: manipulation;
            border-radius: 6px;
        }

        .modal-close:hover {
            color: var(--text-primary);
            background: var(--bg-gray);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }

            .modal {
                padding: 24px 20px;
                margin: 12px;
            }

            .auth-header .logo-img {
                height: 34px;
            }
            .auth-header .logo-icon-fallback {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
        }

        @media (hover: none) {
            .btn:hover:not(:disabled) {
                transform: none !important;
            }
            .btn:active:not(:disabled) {
                transform: scale(0.97);
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="back-link">← Back to Home</a>

            <div class="auth-header">
                <div class="logo">
                    <!-- Professional logo image with fallback -->
                    <img src="logo.jpg" alt="EMTMS Logo" class="logo-img" id="logoImg" onerror="handleLogoError()" />
                    <!-- Fallback in case logo.jpg doesn't load -->
                    <span class="logo-icon-fallback" id="logoFallback" style="display:none;">EM</span>
                    EMTMS
                </div>
                <h1>Welcome Back</h1>
                <p>Log in to your account to continue</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@drmgrdu.ac.in" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Log In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- ===== Professional Popup Modal ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Close modal">✕</button>
            <div class="modal-icon success" id="modalIcon">✅</div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Your action was completed successfully.</p>
            <button class="btn btn-primary" id="modalActionBtn">Got it</button>
        </div>
    </div>

    <script>
        // ===== Logo fallback handler =====
        function handleLogoError() {
            const logoImg = document.getElementById('logoImg');
            const logoFallback = document.getElementById('logoFallback');
            logoImg.style.display = 'none';
            logoFallback.style.display = 'flex';
        }

        // ===== Auto-detect API Base URL =====
        function getApiBase() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8000';
            }
            if (window.location.hostname.includes('muralikorikana.com')) {
                return '/api';
            }
            return '';
        }

        const API_BASE = getApiBase();
        console.log('API_BASE:', API_BASE);

        // ===== Professional Modal System =====
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalActionBtn = document.getElementById('modalActionBtn');

        function showModal(options = {}) {
            const {
                type = 'success',
                title = 'Success!',
                message = 'Action completed successfully.',
                buttonText = 'Got it',
                onAction = null
            } = options;

            const iconMap = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };
            modalIcon.textContent = iconMap[type] || '✅';
            modalIcon.className = 'modal-icon ' + type;

            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalActionBtn.textContent = buttonText;

            modalActionBtn._onAction = onAction || null;

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalActionBtn.addEventListener('click', () => {
            if (typeof modalActionBtn._onAction === 'function') {
                modalActionBtn._onAction();
            }
            closeModal();
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // ===== Login Form Handler =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');

            // Reset error
            errorEl.textContent = '';
            document.querySelectorAll('.form-group input').forEach(el => el.classList.remove('error'));

            // Validation
            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                if (!email) document.getElementById('email').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            // Email format validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorEl.textContent = 'Please enter a valid email address.';
                document.getElementById('email').classList.add('error');
                return;
            }

            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                // Handle non-JSON responses (like HTML errors)
                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    // If response is HTML or other, try to parse as text
                    const text = await response.text();
                    console.error('Non-JSON response:', text);
                    
                    // Check for 502 Bad Gateway
                    if (response.status === 502) {
                        throw new Error('Server is currently unavailable. Please try again later.');
                    }
                    
                    // Try to extract error message from HTML
                    const errorMatch = text.match(/<h1>(.*?)<\/h1>/);
                    if (errorMatch) {
                        throw new Error(errorMatch[1]);
                    }
                    throw new Error(`Server error (${response.status}). Please try again.`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || data.message || 'Invalid credentials. Please try again.');
                }

                // Store session data
                localStorage.setItem('session_token', data.session_token);
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('role', data.role);
                localStorage.setItem('full_name', data.full_name);
                localStorage.setItem('email', data.email);
                localStorage.setItem('department', data.department);
                localStorage.setItem('mobile_number', data.mobile_number);

                // Show success message before redirect
                const redirectUrl = data.role === 'ADMIN' ? '/admin.html' : '/dashboard.html';

                showModal({
                    type: 'success',
                    title: 'Welcome Back!',
                    message: `Redirecting to ${data.role === 'ADMIN' ? 'admin panel' : 'dashboard'}...`,
                    buttonText: 'Continue',
                    onAction: () => {
                        window.location.href = redirectUrl;
                    }
                });

                // Auto-redirect after 2 seconds if modal action not clicked
                setTimeout(() => {
                    if (modalOverlay.classList.contains('active')) {
                        closeModal();
                        window.location.href = redirectUrl;
                    }
                }, 2500);

            } catch (error) {
                console.error('Login error:', error);
                errorEl.textContent = error.message || 'An error occurred. Please try again.';
                document.querySelectorAll('.form-group input').forEach(el => el.classList.add('error'));
            } finally {
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });

        // ===== Check if already logged in =====
        const sessionToken = localStorage.getItem('session_token');
        const role = localStorage.getItem('role');

        if (sessionToken && role) {
            // User is already logged in
            const redirectUrl = role === 'ADMIN' ? '/admin.html' : '/dashboard.html';
            window.location.href = redirectUrl;
        }

        // ===== Service Worker Registration for PWA =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Check if sw.js exists before registering
                fetch('/sw.js')
                    .then(response => {
                        if (response.ok) {
                            return navigator.serviceWorker.register('/sw.js');
                        }
                        console.log('SW file not found, skipping registration');
                        return null;
                    })
                    .then(reg => {
                        if (reg) {
                            console.log('SW registered:', reg);
                        }
                    })
                    .catch(err => {
                        console.log('SW registration skipped:', err.message);
                    });
            });
        }

        // ===== Create a minimal manifest.json if missing =====
        function ensureManifest() {
            // Check if manifest.json exists and is valid
            fetch('/manifest.json')
                .then(response => {
                    if (!response.ok) {
                        console.log('Manifest file not found or invalid');
                        // Could create a minimal manifest here if needed
                    }
                    return response.json();
                })
                .catch(() => {
                    console.log('Manifest not available - PWA features limited');
                });
        }

        ensureManifest();

        console.log('EMTMS Login - Professional & PWA ready');
    </script>

</body>
</html>
