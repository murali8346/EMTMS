<!DOCTYPE html>
<html lang="en"> 
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Login - EMTMS</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="/" class="back-link">← Back to Home</a>

            <div class="auth-header">
                <div class="logo">
                    <!-- Professional logo image with fallback -->
                    <img src="logo.jpg" alt="EMTMS Logo" class="logo-img" id="logoImg" onerror="handleLogoError()" />
                    <!-- Fallback in case logo.jpg doesn't load -->
                    <span class="logo-icon-fallback" id="logoFallback" style="display:none;">EM</span>
                    EMTMS
                </div>
                <h1>Welcome Back</h1>
                <p>Log in to your account to continue</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@drmgrdu.ac.in" required autocomplete="email" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
                </div>

                <div id="errorMessage" class="error-message"></div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Log In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- ===== Professional Popup Modal ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <button class="modal-close" id="modalClose" aria-label="Close modal">✕</button>
            <div class="modal-icon success" id="modalIcon">✅</div>
            <h3 id="modalTitle">Success!</h3>
            <p id="modalMessage">Your action was completed successfully.</p>
            <button class="btn btn-primary" id="modalActionBtn">Got it</button>
        </div>
    </div>

        <script src="js/login.js"></script>

</body>
</html>
