<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Ticket Details - EMTMS</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --primary-glass: rgba(37, 99, 235, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-light: #94a3b8;
            --bg-white: #ffffff;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --nav-height: 64px;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            background: var(--bg-light);
            min-height: 100vh;
            padding-top: var(--nav-height);
        }

        /* ===== Navbar ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
            box-shadow: var(--shadow-sm);
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-img {
            height: 34px;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
            background: white;
            padding: 2px;
        }

        .logo-icon-fallback {
            width: 34px;
            height: 34px;
            background: var(--primary-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 500;
            font-family: var(--font-family);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            gap: 6px;
            min-height: 40px;
            touch-action: manipulation;
            user-select: none;
        }

        .btn-secondary {
            background: var(--bg-gray);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            min-height: 32px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 20px;
            transition: var(--transition);
            font-weight: 500;
        }
        .back-link:hover {
            color: var(--primary);
        }

        .ticket-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .ticket-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .ticket-header .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .ticket-status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }
        .status-assigned {
            background: #dbeafe;
            color: #2563eb;
        }
        .status-in-progress {
            background: #e0e7ff;
            color: #4f46e5;
        }
        .status-completed {
            background: #d1fae5;
            color: #059669;
        }
        .status-cancelled {
            background: #fee2e2;
            color: #dc2626;
        }
        .status-closed {
            background: #e5e7eb;
            color: #4b5563;
        }

        .ticket-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 20px 0;
            padding: 16px 20px;
            background: var(--bg-light);
            border-radius: var(--radius);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            font-weight: 600;
        }

        .meta-item .value {
            font-weight: 500;
            margin-top: 2px;
            font-size: 0.95rem;
        }

        .ticket-description {
            margin: 16px 0;
            padding: 16px;
            background: var(--bg-light);
            border-radius: var(--radius);
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ticket-description strong {
            display: block;
            margin-bottom: 8px;
        }

        .ticket-image {
            margin: 16px 0;
            max-width: 100%;
        }

        .ticket-image img {
            max-width: 100%;
            max-height: 400px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            object-fit: contain;
            background: var(--bg-light);
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        /* ===== Chat Section ===== */
        .chat-section {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chat-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .badge {
            background: var(--primary);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .chat-messages {
            padding: 16px 20px;
            max-height: 400px;
            overflow-y: auto;
            background: var(--bg-light);
        }

        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            align-items: flex-start;
        }

        .message-admin {
            align-items: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: var(--radius);
            word-wrap: break-word;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .message-user .message-bubble {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message-admin .message-bubble {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-meta {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .message-admin .message-meta {
            color: rgba(255, 255, 255, 0.7);
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: white;
            flex-shrink: 0;
        }

        .message-user .message-avatar {
            background: var(--bg-gray);
            color: var(--text-secondary);
            margin-right: 8px;
        }

        .message-admin .message-avatar {
            background: var(--primary);
            margin-left: 8px;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-start;
            width: 100%;
        }

        .message-user .message-wrapper {
            flex-direction: row;
        }

        .message-admin .message-wrapper {
            flex-direction: row-reverse;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .chat-input-area {
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: var(--bg-white);
        }

        .chat-input-area textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: var(--font-family);
            resize: none;
            min-height: 42px;
            max-height: 120px;
            transition: var(--transition);
            background: var(--bg-light);
            line-height: 1.4;
        }

        .chat-input-area textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: white;
        }

        .chat-input-area .btn-send {
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 500;
            font-family: var(--font-family);
            cursor: pointer;
            transition: var(--transition);
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            white-space: nowrap;
            height: 42px;
            min-width: 80px;
        }

        .chat-input-area .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
        }

        .chat-input-area .btn-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-chat {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-chat .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 640px) {
            :root {
                --nav-height: 58px;
            }

            .ticket-card {
                padding: 20px;
            }
            .ticket-meta-grid {
                grid-template-columns: 1fr 1fr;
                padding: 12px 16px;
                gap: 8px;
            }
            .ticket-header {
                flex-direction: column;
            }
            .chat-messages {
                padding: 12px 14px;
                max-height: 280px;
            }
            .chat-input-area {
                flex-direction: column;
                padding: 10px 14px;
            }
            .chat-input-area .btn-send {
                width: 100%;
            }
            .message-bubble {
                max-width: 92%;
            }
            .admin-actions {
                flex-direction: column;
            }
            .admin-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .logo {
                font-size: 1rem;
            }
            .logo-img {
                height: 28px;
            }
            .logo-icon-fallback {
                width: 28px;
                height: 28px;
                font-size: 0.75rem;
            }
            .btn {
                font-size: 0.85rem;
                padding: 6px 14px;
                min-height: 36px;
            }
            .container {
                padding: 12px 10px 30px;
            }
        }

        @media (max-width: 400px) {
            .ticket-meta-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (hover: none) {
            .btn:hover {
                transform: none !important;
            }
            .btn:active {
                transform: scale(0.97);
            }
        }

        .text-muted {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .flex {
            display: flex;
        }
        .flex-center {
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- ===== Navbar ===== -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">
                <img src="logo.jpg" alt="EMTMS Logo" class="logo-img" id="logoImg" />
                <span class="logo-icon-fallback" id="logoFallback" style="display:none;">EM</span>
                EMTMS
            </a>
            <div class="nav-actions">
                <span style="font-size:0.8rem;color:var(--text-light);" id="userRoleDisplay"></span>
                <a href="/dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
                <a href="#" class="btn btn-secondary btn-sm" id="logoutBtn">Logout</a>
            </div>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <div class="container">
        <a href="/dashboard.html" class="back-link">← Back to Dashboard</a>

        <div id="ticketContent">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top:16px;color:var(--text-secondary);">Loading ticket details...</p>
            </div>
        </div>
    </div>

    <script>
        // ===== Logo fallback =====
        const logoImg = document.getElementById('logoImg');
        const logoFallback = document.getElementById('logoFallback');

        logoImg.addEventListener('error', function() {
            this.style.display = 'none';
            logoFallback.style.display = 'flex';
        });

        // ===== Auto-detect API Base URL =====
        function getApiBase() {
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8000';
            }
            if (window.location.hostname.includes('muralikorikana.com')) {
                return '/api';
            }
            return '';
        }

        function getImageUrl(imagePath) {
            if (!imagePath) return null;
            if (imagePath.startsWith('http://') || imagePath.startsWith('https://')) {
                return imagePath;
            }
            if (window.location.hostname.includes('muralikorikana.com')) {
                return imagePath;
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return `http://localhost:8000${imagePath}`;
            }
            return imagePath;
        }

        const API_BASE = getApiBase();
        console.log('API_BASE:', API_BASE);

        // ===== Session Check =====
        const sessionToken = localStorage.getItem('session_token');
        const role = localStorage.getItem('role');
        const userName = localStorage.getItem('full_name') || 'User';

        if (!sessionToken) {
            window.location.href = '/login.html';
        }

        // Display user role
        document.getElementById('userRoleDisplay').textContent = role === 'ADMIN' ? '🔑 Admin' : '👤 ' + userName;

        // ===== Logout =====
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = '/login.html';
        });

        // ===== Get Ticket ID =====
        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('id');

        if (!ticketId) {
            window.location.href = '/dashboard.html';
        }

        let currentTicket = null;
        let messageInterval = null;

        // ===== Fetch Ticket Details =====
        async function fetchTicketDetails() {
            try {
                const response = await fetch(`${API_BASE}/ticket/${ticketId}`, {
                    headers: {
                        'X-Session-Token': sessionToken,
                    },
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.clear();
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to fetch ticket details');
                }

                currentTicket = await response.json();
                renderTicket(currentTicket);
                await fetchMessages();

            } catch (error) {
                document.getElementById('ticketContent').innerHTML = `
                    <div class="ticket-card">
                        <p style="color:#dc2626;text-align:center;padding:30px 0;font-weight:500;">
                            ❌ Error loading ticket: ${error.message}
                        </p>
                        <div style="text-align:center;margin-top:12px;">
                            <a href="/dashboard.html" class="btn btn-primary btn-sm">Go to Dashboard</a>
                        </div>
                    </div>
                `;
            }
        }

        // ===== Render Ticket =====
        function renderTicket(ticket) {
            const statusClass = ticket.status.toLowerCase().replace(' ', '-');
            const imageUrl = getImageUrl(ticket.image);
            const isAdmin = role === 'ADMIN';

            // Priority labels
            const priorityColors = {
                'Low': '#059669',
                'Medium': '#2563eb',
                'High': '#d97706',
                'Urgent': '#dc2626'
            };
            const priorityBg = {
                'Low': '#d1fae5',
                'Medium': '#dbeafe',
                'High': '#fef3c7',
                'Urgent': '#fee2e2'
            };

            document.getElementById('ticketContent').innerHTML = `
                <div class="ticket-card">
                    <div class="ticket-header">
                        <div>
                            <h1>${ticket.ticket_number}</h1>
                            <div class="subtitle">
                                Created by: <strong>${ticket.user_name || 'Unknown User'}</strong>
                                ${ticket.user_department ? ' • ' + ticket.user_department : ''}
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                            <span class="ticket-status status-${statusClass}">${ticket.status}</span>
                            <span style="padding:4px 12px;border-radius:12px;font-size:0.7rem;font-weight:600;background:${priorityBg[ticket.priority] || '#e5e7eb'};color:${priorityColors[ticket.priority] || '#4b5563'};">
                                ${ticket.priority}
                            </span>
                        </div>
                    </div>

                    <div class="ticket-meta-grid">
                        <div class="meta-item">
                            <span class="label">Block</span>
                            <span class="value">${ticket.block}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Room Number</span>
                            <span class="value">${ticket.room_number}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Fault Type</span>
                            <span class="value">${ticket.fault_type}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Created</span>
                            <span class="value">${new Date(ticket.created_at).toLocaleString()}</span>
                        </div>
                        <div class="meta-item">
                            <span class="label">Last Updated</span>
                            <span class="value">${new Date(ticket.updated_at).toLocaleString()}</span>
                        </div>
                        ${ticket.assigned_worker_name ? `
                        <div class="meta-item">
                            <span class="label">Assigned To</span>
                            <span class="value">${ticket.assigned_worker_name} ${ticket.assigned_worker_phone ? '📞 ' + ticket.assigned_worker_phone : ''}</span>
                        </div>
                        ` : ''}
                        ${ticket.assigned_at ? `
                        <div class="meta-item">
                            <span class="label">Assigned At</span>
                            <span class="value">${new Date(ticket.assigned_at).toLocaleString()}</span>
                        </div>
                        ` : ''}
                        <div class="meta-item">
                            <span class="label">HOD Approval</span>
                            <span class="value">${ticket.hod_approval ? '✅ Approved' : '—'}</span>
                        </div>
                    </div>

                    ${ticket.description ? `
                        <div class="ticket-description">
                            <strong>📝 Description</strong>
                            ${ticket.description}
                        </div>
                    ` : ''}

                    ${imageUrl ? `
                        <div class="ticket-image">
                            <img src="${imageUrl}" alt="Ticket image" onerror="this.style.display='none'" />
                        </div>
                    ` : ''}

                    ${isAdmin ? `
                        <div class="admin-actions">
                            <button class="btn btn-primary btn-sm" onclick="updateStatus('${ticket.ticket_id}')">
                                🔄 Update Status
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTicket('${ticket.ticket_id}')">
                                🗑️ Delete Ticket
                            </button>
                            <button class="btn btn-success btn-sm" onclick="assignWorker('${ticket.ticket_id}')">
                                👷 Assign Worker
                            </button>
                        </div>
                    ` : ''}
                </div>

                <!-- Chat Section -->
                <div class="chat-section">
                    <div class="chat-header">
                        <h3>
                            💬 Conversation
                            <span class="badge" id="messageCount">0</span>
                        </h3>
                        <span style="font-size:0.75rem;color:var(--text-light);">
                            ${isAdmin ? '🔵 Replying as Admin' : '🟢 Replying as User'}
                        </span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-chat">
                            <div class="icon">💬</div>
                            <p>No messages yet. Start the conversation!</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            `;

            // Auto-resize textarea
            const textarea = document.getElementById('messageInput');
            if (textarea) {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                });

                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
                textarea.focus();
            }
        }

        // ===== Messages =====
        async function fetchMessages() {
            try {
                const response = await fetch(`${API_BASE}/ticket/${ticketId}/messages`, {
                    headers: {
                        'X-Session-Token': sessionToken,
                    },
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch messages');
                }

                const messages = await response.json();
                renderMessages(messages);

                const countEl = document.getElementById('messageCount');
                if (countEl) {
                    countEl.textContent = messages.length;
                }

            } catch (error) {
                console.error('Error fetching messages:', error);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat">
                        <div class="icon">💬</div>
                        <p>No messages yet. Start the conversation!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => {
                const isAdmin = msg.is_admin;
                const senderName = msg.user_name || (isAdmin ? 'Admin' : 'User');
                const avatar = senderName.charAt(0).toUpperCase();
                const time = new Date(msg.created_at).toLocaleString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    month: 'short',
                    day: 'numeric'
                });

                return `
                    <div class="message message-${isAdmin ? 'admin' : 'user'}">
                        <div class="message-wrapper">
                            <div class="message-avatar">${avatar}</div>
                            <div class="message-content">
                                <div class="message-bubble">${escapeHtml(msg.message)}</div>
                                <div class="message-meta">
                                    <span>${senderName}</span>
                                    <span>•</span>
                                    <span>${time}</span>
                                    ${isAdmin ? '<span>🔵 Admin</span>' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE}/ticket/${ticketId}/messages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken,
                    },
                    body: JSON.stringify({ message }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Failed to send message');
                }

                input.value = '';
                input.style.height = 'auto';
                await fetchMessages();

            } catch (error) {
                alert('❌ Error sending message: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send';
                input.focus();
            }
        }

        // ===== Helper =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== Admin Functions =====
        async function updateStatus(ticketId) {
            const statuses = ['Pending', 'Assigned', 'In Progress', 'Completed', 'Cancelled', 'Closed'];
            const status = prompt('Enter new status:\n' + statuses.join(', '));
            if (!status) return;

            if (!statuses.includes(status)) {
                alert('Invalid status. Please choose from: ' + statuses.join(', '));
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/ticket/${ticketId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken,
                    },
                    body: JSON.stringify({ status }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Update failed');
                }

                alert('✅ Ticket status updated to ' + status + '!');
                fetchTicketDetails();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function assignWorker(ticketId) {
            const workerEmail = prompt('Enter worker email to assign:');
            if (!workerEmail) return;

            try {
                const response = await fetch(`${API_BASE}/admin/ticket/${ticketId}/assign`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken,
                    },
                    body: JSON.stringify({ worker_email: workerEmail }),
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Assignment failed');
                }

                alert('✅ Worker assigned successfully!');
                fetchTicketDetails();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function deleteTicket(ticketId) {
            if (!confirm('⚠️ Are you sure you want to delete this ticket? This action cannot be undone.')) return;

            try {
                const response = await fetch(`${API_BASE}/admin/ticket/${ticketId}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Session-Token': sessionToken,
                    },
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Delete failed');
                }

                alert('✅ Ticket deleted successfully!');
                window.location.href = '/dashboard.html';

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ===== Auto-Refresh =====
        function startAutoRefresh() {
            if (messageInterval) clearInterval(messageInterval);
            messageInterval = setInterval(fetchMessages, 10000);
        }

        // ===== Init =====
        fetchTicketDetails();
        startAutoRefresh();

        window.addEventListener('beforeunload', function() {
            if (messageInterval) clearInterval(messageInterval);
        });

        console.log('EMTMS Ticket Details - Professional & PWA ready');
    </script>

</body>
</html>
